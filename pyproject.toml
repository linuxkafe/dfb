[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dfb"
version = "0.1.0"
description = "Deck Fly Brain — autonomous flight decision service for Steam Deck"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pymavlink",
    "pyserial",
    "pyyaml",
    "prometheus-client",
    "structlog",
    "grpcio",
    "protobuf",
]

[project.optional-dependencies]
test = [
    "requests",
    "psutil",
    "pytest-asyncio",
]
monitor = [
    "psutil",
]
sim = [
    "mujoco",
    "onnxruntime",
    "onnx",
    "torch",
    "numpy",
]
cli = [
    "typer",
    "rich",
]
filter = [
    "filterpy",
]
grpc = [
    "grpcio-tools",
]

[project.scripts]
dfb = "dfb.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests", "sim"]
addopts = "--cov=src --cov-report=xml --cov-report=term"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]