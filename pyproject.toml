[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aes-project"
version = "0.1.0"
description = "AES-managed Python project"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=xml --cov-report=term"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
