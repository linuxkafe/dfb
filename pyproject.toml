[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dfb"
version = "0.1.0"
description = "Deck Fly Brain — autonomous flight decision service for Steam Deck"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pymavlink",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "requests",
    "psutil",
]
monitor = [
    "psutil",
]
sim = [
    "mujoco",
    "onnxruntime",
    "onnx",
    "torch",
    "numpy",
]

[tool.pytest.ini_options]
testpaths = ["tests", "sim"]
addopts = "--cov=src --cov-report=xml --cov-report=term"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]