[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dfb"
version = "0.1.0"
description = "Deck Fly Brain — autonomous flight decision service for Steam Deck"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pymavlink",
    "pyserial",
    "pyyaml",
    "prometheus-client",
    "structlog",
    "grpcio>=1.84.0",
    "protobuf>=7.35.1",
]

[project.optional-dependencies]
test = [
    "requests",
    "psutil",
    "pytest-asyncio",
    "pytest",
    "pytest-cov",
    "ruff",
    "numpy",
]
monitor = [
    "psutil",
]
sim = [
    "mujoco",
    "onnxruntime",
    "onnx",
    "torch",
    "numpy",
]
cli = [
    "typer",
    "rich",
]
filter = [
    "filterpy",
]
grpc = [
    "grpcio-tools",
]

[project.scripts]
dfb = "dfb.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests", "sim"]
addopts = "--cov=src --cov-report=xml --cov-report=term"
pythonpath = ["src"]
markers = [
    "integration: requires a live subprocess or external dependency",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E731", "F401", "I001", "W292", "W293"]
"src/dfb/vulkan_engine.py" = ["E501"]  # wrapped C-FFI call sites, T002: no aggressive rewrite
"src/dfb/grpc/flybrain_pb2.py" = ["E501", "I001", "W292"]  # generated code
"src/dfb/grpc/flybrain_pb2_grpc.py" = ["E501", "I001", "F401", "W292"]  # generated code
"src/dfb/grpc/flybrain_pb2.pyi" = ["E501"]  # generated code