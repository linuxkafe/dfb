name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup
        run: pip install -e ".[test]"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Quality gates
        run: make check

      - name: Safety certification gate
        run: make safety-check

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false

      - name: Security audit
        run: pip install pip-audit --quiet && pip-audit || true
