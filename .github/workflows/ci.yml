name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 vulkan-tools

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e .[test,grpc,monitor,cli]

      - name: Run lint
        run: make lint

      - name: Run tests with coverage
        run: make test

      - name: Run safety check
        run: make safety-check

      - name: Check coverage threshold
        run: make test-check

      - name: Run docs check
        run: make docs-check

      - name: Run code check
        run: make code-check

  # Optional: Separate job for coverage reporting
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    if: always()
    needs: quality-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e .[test,grpc,monitor,cli]
      - name: Run tests to generate coverage
        run: make test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: env.CODECOV_TOKEN != ''
        with:
          files: ./coverage.xml
          fail_ci_if_error: false